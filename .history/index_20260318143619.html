<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Wallet</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card form-card">
            <h2 class="card-title">Thêm Giao Dịch</h2>
            <form id="walletForm">
                
                <div class="form-group">
                    <label class="form-label">Loại giao dịch <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="type" value="income" id="typeIncome"> 
                            <span class="radio-custom income">Thu</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="type" value="expense" id="typeExpense" checked> 
                            <span class="radio-custom expense">Chi</span>
                        </label>
                    </div>
                    <span class="error-msg" id="typeError"></span>
                </div>

                <div class="form-group">
                    <label for="amount" class="form-label">Số tiền (VNĐ) <span class="required">*</span></label>
                    <input type="number" id="amount" class="form-control" placeholder="Nhập số tiền..." min="1">
                    <span class="error-msg" id="amountError"></span>
                </div>

                <div class="form-group">
                    <label for="category" class="form-label">Danh mục <span class="required">*</span></label>
                    <select id="category" class="form-control">
                        <option value="">-- Chọn danh mục --</option>
                        <option value="Ăn uống">Ăn uống</option>
                        <option value="Đi lại">Đi lại</option>
                        <option value="Mua sắm">Mua sắm</option>
                        <option value="Học tập">Học tập</option>
                        <option value="Giải trí">Giải trí</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <span class="error-msg" id="categoryError"></span>
                </div>

                <div class="form-group">
                    <label for="date" class="form-label">Ngày giao dịch <span class="required">*</span></label>
                    <input type="date" id="date" class="form-control">
                    <span class="error-msg" id="dateError"></span>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Mô tả</label>
                    <input type="text" id="description" class="form-control" placeholder="Nhập ghi chú chi tiết...">
                </div>

                <div class="btn-group">
                    <button type="button" id="btnCancel" class="btn btn-cancel">Hủy</button>
                    <button type="submit" id="btnSave" class="btn btn-save">Lưu Giao Dịch</button>
                </div>
            </form>
        </div>

        <div class="card list-card">
            <h2 class="card-title">Lịch Sử Giao Dịch</h2>
            <div id="transactionList" class="transaction-list">
                </div>
        </div>
    </div>

    <div id="toast" class="toast">Lưu giao dịch thành công!</div>

    <script src="script.js"></script>
</body>
</html>
