<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Wallet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-wallet"></i> Student Wallet</h2>
                <p>Quản lý chi tiêu thông minh</p>
            </div>

            <form id="walletForm">
                <div class="form-group type-group">
                    <label class="radio-label income-label">
                        <input type="radio" name="type" value="income">
                        <span class="radio-custom"></span> Thu
                    </label>
                    <label class="radio-label expense-label">
                        <input type="radio" name="type" value="expense" checked>
                        <span class="radio-custom"></span> Chi
                    </label>
                </div>

                <div class="form-group">
                    <label for="amount">Số tiền</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">đ</span>
                        <input type="number" id="amount" placeholder="Nhập số tiền...">
                    </div>
                    <span class="error-message" id="amountError">Vui lòng nhập số tiền hợp lệ (> 0)</span>
                </div>

                <div class="form-group">
                    <label for="desc">Mô tả</label>
                    <input type="text" id="desc" placeholder="Ví dụ: Tiền trọ tháng 10...">
                </div>

                <div class="form-group">
                    <label for="date">Ngày giao dịch</label>
                    <input type="date" id="date">
                    <span class="error-message" id="dateError">Vui lòng chọn ngày giao dịch</span>
                </div>

                <div class="form-group">
                    <label for="category">Danh mục</label>
                    <select id="category">
                        <option value="" disabled selected>-- Chọn danh mục --</option>
                        <option value="Ăn uống">Ăn uống</option>
                        <option value="Đi lại">Đi lại</option>
                        <option value="Mua sắm">Mua sắm</option>
                        <option value="Học tập">Học tập</option>
                        <option value="Giải trí">Giải trí</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <span class="error-message" id="categoryError">Vui lòng chọn danh mục</span>
                </div>

                <div class="actions">
                    <button type="button" id="btnCancel" class="btn btn-cancel">Hủy</button>
                    <button type="submit" id="btnSave" class="btn btn-save">Lưu giao dịch</button>
                </div>
            </form>
        </div>

        <div class="card list-card">
            <h3>Lịch sử gần đây</h3>
            <div id="emptyState" class="empty-state">Chưa có giao dịch nào.</div>
            <ul id="transactionList" class="transaction-list">
                </ul>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span>Lưu giao dịch thành công!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
