<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Wallet | Quản lý chi tiêu chuyên nghiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="toast" class="toast hidden">
        <i data-lucide="check-circle"></i>
        <span id="toast-msg">Lưu thành công!</span>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 group cursor-pointer">
                <div class="bg-indigo-600 p-2 rounded-xl text-white group-hover:rotate-12 transition-transform">
                    <i data-lucide="wallet"></i>
                </div>
                <h1 class="text-xl font-bold">Student <span class="text-indigo-600">Wallet</span></h1>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 animate__animated animate__fadeInDown">
            <div class="stat-card border-l-4 border-indigo-500">
                <div class="text-sm text-slate-500 font-medium">Số dư hiện tại</div>
                <div id="balance" class="text-3xl font-bold mt-1">0đ</div>
            </div>
            <div class="stat-card border-l-4 border-emerald-500">
                <div class="text-sm text-slate-500 font-medium">Tổng thu nhập</div>
                <div id="total-income" class="text-3xl font-bold mt-1 text-emerald-600">0đ</div>
            </div>
            <div class="stat-card border-l-4 border-rose-500">
                <div class="text-sm text-slate-500 font-medium">Tổng chi tiêu</div>
                <div id="total-expense" class="text-3xl font-bold mt-1 text-rose-600">0đ</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 animate__animated animate__fadeInLeft">
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center">
                        <i data-lucide="edit-3" class="mr-2 text-indigo-600"></i> Nhập giao dịch
                    </h2>
                    
                    <form id="form" class="space-y-5">
                        <div class="flex bg-slate-100 p-1.5 rounded-2xl">
                            <button type="button" id="btn-inc" onclick="toggleType('income')" class="type-btn active text-emerald-600">Thu nhập</button>
                            <button type="button" id="btn-exp" onclick="toggleType('expense')" class="type-btn">Chi tiêu</button>
                        </div>

                        <div class="input-group">
                            <label>Số tiền (VNĐ)</label>
                            <input type="number" id="amount" placeholder="50.000">
                            <span class="error-text" id="err-amount">Vui lòng nhập số tiền > 0</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label>Danh mục</label>
                                <select id="category">
                                    <option>Ăn uống</option>
                                    <option>Đi lại</option>
                                    <option>Mua sắm</option>
                                    <option>Học tập</option>
                                    <option>Giải trí</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Ngày</label>
                                <input type="date" id="date">
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Mô tả ngắn</label>
                            <textarea id="desc" rows="2" placeholder="Ví dụ: Ăn phở sáng..."></textarea>
                            <span class="error-text" id="err-desc">Mô tả không được để trống</span>
                        </div>

                        <div class="flex space-x-3 pt-4">
                            <button type="button" onclick="resetForm()" class="btn-secondary">Hủy</button>
                            <button type="submit" id="btn-save" class="btn-primary">Lưu giao dịch</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-7 animate__animated animate__fadeInRight">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 min-h-[500px]">
                    <h2 class="text-xl font-bold mb-6">Lịch sử giao dịch</h2>
                    <div id="list-container" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
